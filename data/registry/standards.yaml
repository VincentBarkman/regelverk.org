  - slug: nist-sp-800-82
    designation: NIST SP 800-82 Rev. 3
    publisher: NIST
    jurisdiction: USA
    url: https://csrc.nist.gov/pubs/sp/800/82/r3/final
    sites: [ot]
    relatedLaws: [nis2, cer]
    title:
      sv: NIST SP 800-82
      en: NIST SP 800-82
    description:
      sv: Vägledning för cybersäkerhet i industriella styrsystem (ICS/OT).
      en: Guide to operational technology (OT) security for industrial control systems.
    overview:
      sv: |
        NIST SP 800-82 beskriver hur industriella styrsystem skiljer sig från vanliga IT-system och hur säkerhetsprogram anpassas till driftmiljöer där tillgänglighet och personsäkerhet är avgörande. Publikationen är fri att ladda ner från NIST men saknar maskinläsbar kontrollkatalog; komplettera med NIST SP 800-53 och IEC 62443.
      en: |
        NIST SP 800-82 explains how industrial control systems differ from conventional IT systems and how security programs adapt to environments where availability and human safety are paramount. The publication is free to download from NIST but has no machine-readable control catalogue; complement it with NIST SP 800-53 and IEC 62443.
  - slug: iec-62443-2-1
    designation: IEC 62443-2-1:2024
    publisher: IEC
    url: https://webstore.iec.ch/en/publication/62883
    sites: [ot]
    relatedLaws: [cra, nis2]
    title:
      sv: IEC 62443-2-1
      en: IEC 62443-2-1
    description:
      sv: Krav på säkerhetsprogram för driftägare av industriella automations- och styrsystem.
      en: Security program requirements for industrial automation and control system asset owners.
    overview:
      sv: |
        Del 2-1 anger krav på det säkerhetsprogram en driftägare ska ha för sin IACS-miljö. Andra utgåvan (2024) strukturerar kraven i SPE-element och inför en mognadsmodell för utvärdering.
      en: |
        Part 2-1 specifies the security programme an asset owner must maintain for its IACS environment. The second edition (2024) structures requirements as SPE elements and introduces a maturity model.
  - slug: iec-62443-3-2
    designation: IEC 62443-3-2:2020
    publisher: IEC
    url: https://webstore.iec.ch/en/publication/30727
    sites: [ot]
    relatedLaws: [cra, nis2]
    title:
      sv: IEC 62443-3-2
      en: IEC 62443-3-2
    description:
      sv: Säkerhetsriskbedömning vid systemdesign med zoner och kanaler.
      en: Security risk assessment for system design using zones and conduits.
    overview:
      sv: |
        Del 3-2 beskriver metoden för att dela in ett IACS-system i zoner och kanaler, utföra riskbedömning och fastställa målsäkerhetsnivåer (SL-T). Det är utgångspunkten för att välja krav ur del 3-3.
      en: |
        Part 3-2 describes the method for partitioning an IACS into zones and conduits, assessing risk and setting target security levels (SL-T). It is the starting point for selecting requirements from part 3-3.
  - slug: iec-62443-4-1
    designation: IEC 62443-4-1:2018
    publisher: IEC
    url: https://webstore.iec.ch/en/publication/33615
    sites: [ot, it]
    title:
