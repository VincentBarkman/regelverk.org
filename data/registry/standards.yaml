      en: PCI DSS – Payment Card Industry Data Security Standard
    description:
      sv: Kravstandard för skydd av kortinnehavardata hos kortindustrins aktörer.
      en: Requirements standard for protecting cardholder data across the payment card industry.
    overview:
      sv: |
        PCI DSS ställer tolv kravområden på organisationer som lagrar, behandlar eller överför kortinnehavardata. Standarden ges ut av PCI Security Standards Council; den aktuella versionen 4.0.1 publicerades 2024. Standardtexten hämtas från PCI SSC:s dokumentbibliotek.
      en: |
        PCI DSS defines twelve requirement areas for organisations that store, process or transmit cardholder data. The standard is published by the PCI Security Standards Council; the current version 4.0.1 was released in 2024. The standard text is obtained from the PCI SSC document library.
