      en: IEC 62443
    description:
      sv: Standardserie för säkerhet i industriella automations- och styrsystem.
      en: Standards series for security in industrial automation and control systems.
  - slug: iec-62443-3-3
    designation: IEC 62443-3-3:2013
    publisher: IEC
    url: https://webstore.iec.ch/en/publication/7033
    sites: [ot]
    relatedLaws: [cra, nis2]
    title:
      sv: IEC 62443-3-3
      en: IEC 62443-3-3
    description:
      sv: Del av IEC 62443-serien om säkerhetskrav och säkerhetsnivåer för industriella styrsystem.
      en: IEC 62443 part on system security requirements and security levels.
    overview:
      sv: |
        Del 3-3 beskriver tekniska säkerhetskrav för industriella automations- och styrsystem. Den används när en anläggningsägare och leverantör ska ange vilken säkerhetsnivå ett system behöver kunna uppnå.

        Kraven är ordnade efter sju grundläggande säkerhetsområden, bland annat identifiering, åtkomstkontroll, systemintegritet och tillgänglighet. Säkerhetsnivåer måste väljas utifrån systemets riskbedömning; en katalogpost ersätter inte standardtexten.
      en: |
        Part 3-3 sets out technical security requirements for industrial automation and control systems. Asset owners and suppliers use it to specify the security capability a system needs.

        The requirements are organized around seven foundational security areas, including identification, access control, system integrity, and availability. Security levels need to follow a system-specific risk assessment; the catalogue listing does not replace the standard.
  - slug: iso-45001
    designation: ISO 45001:2018
    publisher: SIS
    issuer: ISO
    url: https://www.sis.se/en/produkter/environment-health-protection-safety/occupational-safety-industrial-hygiene/iso-450012018/
    sites: [arbetsmiljo]
    relatedLaws: [arbetsmiljolagen, afs-2023-1]
    title:
      sv: ISO 45001
      en: ISO 45001
    description:
      sv: Standard för ledningssystem för arbetsmiljö.
      en: Standard for occupational health and safety management systems.
    overview:
      sv: |
        ISO 45001 beskriver hur en organisation kan bygga upp ett ledningssystem för att förebygga arbetsrelaterade skador och ohälsa. Den är tillämplig på verksamheter av olika storlek och inriktning.

        Arbetet omfattar bland annat ledningens ansvar, arbetstagarnas medverkan, identifiering av faror, hantering av arbetsmiljörisker och uppföljning. En certifiering kan visa att ett ledningssystem har granskats, men ersätter inte arbetsmiljölagens krav.
      en: |
        ISO 45001 describes how an organization can establish a management system to prevent work-related injury and ill health. It applies to organizations of different sizes and activities.

        The system covers leadership, worker participation, hazard identification, occupational health and safety risks, and performance review. Certification can demonstrate that the system has been audited, but does not replace applicable legal duties.
  - slug: ss-en-54-1
    designation: SS-EN 54-1:2021
    publisher: SIS
    url: https://www.sis.se/produkter/miljo-och-halsoskydd-sakerhet/skydd-mot-brand/brandskydd/ss-en-54-120212/
    sites: [brandskydd]
    relatedLaws: [lso]
    title:
      sv: SS-EN 54-1
      en: SS-EN 54-1
    description:
      sv: Introduktion till standardserien för branddetekterings- och brandlarmsystem.
      en: Introduction to the fire detection and fire alarm systems standards series.
    overview:
      sv: |
        SS-EN 54-1 definierar begrepp som används i EN 54-serien och beskriver hur delstandarderna är uppbyggda. Den behandlar funktionerna hos komponenterna i branddetekterings- och brandlarmsystem.

        Serien gäller sådana system i byggnader och anläggningar. Brandvarnare för bostäder omfattas i stället av andra standarder, bland annat EN 14604.
      en: |
        SS-EN 54-1 defines terminology used throughout the EN 54 series and explains the principles behind its parts. It describes the functions of components in fire detection and alarm systems.

        The series concerns systems in buildings and civil engineering works. Domestic smoke alarms are covered by other standards, including EN 14604.
  - slug: iec-60364-1
    designation: IEC 60364-1:2025
    publisher: IEC
    url: https://webstore.iec.ch/en/publication/63699
    sites: [el]
    relatedLaws: [elsakerhetslagen, elsak-fs-2022-1]
    title:
      sv: IEC 60364-1
      en: IEC 60364-1
    description:
      sv: Grundläggande principer och säkerhetskrav för lågspänningsinstallationer.
      en: Fundamental principles and safety requirements for low-voltage electrical installations.
    overview:
      sv: |
        IEC 60364-1 anger grundläggande principer för säkra elektriska lågspänningsinstallationer och introducerar bedömningen av installationens allmänna förutsättningar. Del 1 ger ramen för de övriga delarna i serien.

        Vid projektering behöver kraven i relevanta delstandarder och tillämpliga nationella regler läsas tillsammans. Utgåvan från 2025 ersätter den tidigare utgåvan från 2005.
      en: |
        IEC 60364-1 sets out fundamental safety principles for low-voltage electrical installations and introduces the assessment of general installation characteristics. Part 1 provides the framework for the rest of the series.

        Design work also requires the relevant parts of the series and applicable national rules. The 2025 edition replaces the previous 2005 edition.
  - slug: ssf-200
    designation: SSF 200 utgåva 6
    match: SSF 200
    edition: 6
    publisher: SSF
    url: https://www.stoldskyddsforeningen.se/butik/foretag/ssf-normer/skal-inbrottsskydd/ssf-200-utg-6-regler-for-inbrottsskydd-byggnader-och-lokaler/
    sites: [fysisk]
    title:
      sv: SSF 200 – Regler för inbrottsskydd
      en: SSF 200 – Rules for burglar resistance
    description:
      sv: Regler för mekaniskt inbrottsskydd av byggnader och lokaler, skyddsklass 1–3.
      en: Rules for physical burglary protection of buildings and premises, protection classes 1–3.
    overview:
      sv: |
        SSF 200 behandlar byggnaders och lokalers mekaniska skalskydd. Skyddsklass 1–3 används för att beskriva skyddsnivåer för exempelvis väggar, dörrar, fönster, lås och andra delar av omslutningsytan.

        Normen omfattar inte projektering av inbrottslarm eller kamerabevakning. Sådana system behöver bedömas mot andra krav, exempelvis SSF 130 för inbrotts- och överfallslarm.
      en: |
        SSF 200 concerns the physical security of buildings and premises. Protection classes 1–3 describe the required level of protection for elements such as walls, doors, windows, locks, and other parts of the building envelope.

        The standard does not cover the design of intruder alarms or surveillance systems. Those systems are assessed against other requirements, such as SSF 130 for intruder and hold-up alarms.
  - slug: ssf-130
    designation: SSF 130 utgåva 10
    match: SSF 130
    edition: 10
    publisher: SSF
    url: https://www.stoldskyddsforeningen.se/butik/foretag/ssf-normer/inbrottslarm/ssf-130-utg-10-projektering-och-installation-av-inbrotts-och-overfallslarmanlaggning/
    sites: [fysisk]
    title:
      sv: SSF 130 – Inbrotts- och överfallslarm
      en: SSF 130 – Intruder and hold-up alarms
    description:
      sv: Projektering och installation av inbrotts- och överfallslarm, larmklass 1–4.
      en: Design and installation of intruder and hold-up alarms, alarm classes 1–4.
    overview:
      sv: |
        SSF 130 ger regler för projektering, installation, provning och dokumentation av inbrotts- och överfallslarmanläggningar. Den skiljer mellan larmklass 1–4 beroende på anläggningens kravbild.

        Larmklasserna gäller larmsystemet, inte det mekaniska skalskyddet. Det senare behandlas i SSF 200. Kravställare och försäkringsvillkor avgör ofta vilka klasser som ska användas i ett visst objekt.
      en: |
        SSF 130 provides rules for the design, installation, testing, and documentation of intruder and hold-up alarms. It distinguishes alarm classes 1–4 according to the system requirements.

        Alarm classes apply to the alarm system, not the building's physical protection, which is addressed by SSF 200. Customers and insurance terms often determine the required classes for a particular site.
