      en: IEC 62443-4-1
    description:
      sv: Krav på säker produktutvecklingscykel för IACS-komponenter.
      en: Secure product development lifecycle requirements for IACS components.
    relatedLaws: [cra]
    overview:
      sv: |
        Del 4-1 ställer processkrav på tillverkares säkra utvecklingslivscykel för produkter i industriella styrsystem, från kravdefinition till sårbarhetshantering och produktens livsslut.
      en: |
        Part 4-1 sets process requirements for manufacturers' secure development lifecycle of industrial control system products, from requirements definition to vulnerability management and product end-of-life.
  - slug: iec-62443-4-2
    designation: IEC 62443-4-2:2019
    publisher: IEC
    url: https://webstore.iec.ch/en/publication/34421
