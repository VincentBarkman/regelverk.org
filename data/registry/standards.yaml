      en: IEC 62443-4-2
    description:
      sv: Tekniska säkerhetskrav för IACS-komponenter, ordnade efter sju grundläggande säkerhetsområden.
      en: Technical security requirements for IACS components, organised around seven foundational requirements.
    overview:
      sv: |
        Del 4-2 anger tekniska komponentkrav kopplade till de sju grundläggande kraven i IEC 62443-1-1 och definierar kapacitetssäkerhetsnivåer SL-C för komponenter.
      en: |
        Part 4-2 specifies technical component requirements linked to the seven foundational requirements of IEC 62443-1-1 and defines capability security levels SL-C for components.
  - slug: pci-dss
    designation: PCI DSS v4.0.1
    match: PCI DSS
    publisher: PCI SSC
