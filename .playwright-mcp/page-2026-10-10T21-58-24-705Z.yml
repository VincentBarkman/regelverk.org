    - article [ref=f34e7]:
      - heading "Privacy policy" [level=1] [ref=f34e8]
      - paragraph [ref=f34e9]: This policy describes how regelverk.org handles personal data.
      - heading "Data controller" [level=2] [ref=f34e10]
      - paragraph [ref=f34e11]:
        - text: regelverk.org is run as an independent project. The data controller is the project owner, reachable through the
        - link "GitHub repository" [ref=f34e12] [cursor=pointer]:
          - /url: https://github.com/VincentBarkman/regelverk.org
        - text: .
      - heading "What data is processed" [level=2] [ref=f34e13]
      - list [ref=f34e14]:
        - listitem [ref=f34e15]: There are no accounts and no registration is required.
        - listitem [ref=f34e16]: A functional cookie stores your language choice (sv/en). It contains no personal data and does not track you.
        - listitem [ref=f34e17]: The host, Cloudflare, may process technical logs (IP address and similar) for operation, security and abuse prevention.
      - heading "No tracking" [level=2] [ref=f34e18]
      - paragraph [ref=f34e19]: The site uses no analytics, no third-party cookies and no advertising profiles.
      - heading "Legal basis" [level=2] [ref=f34e20]
      - paragraph [ref=f34e21]: Processing is based on legitimate interest (operating a secure and functional service) and on providing the features you use, such as the language choice.
      - heading "Your rights" [level=2] [ref=f34e22]
      - paragraph [ref=f34e23]: Under the GDPR you have the right of access, rectification, erasure, restriction, data portability, and to lodge a complaint with the Swedish Authority for Privacy Protection (IMY).
      - heading "Changes" [level=2] [ref=f34e24]
      - paragraph [ref=f34e25]: This policy may be updated. The current version is always available on this page.
