name: Feature request
description: Suggest a feature or improvement for the site
title: '[Feature]: '
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: Describe the feature or improvement
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why?
      description: What problem does it solve, or who benefits?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional — other ways to solve the same problem
