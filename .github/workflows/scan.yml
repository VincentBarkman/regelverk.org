name: Rescan sources

on:
  schedule:
    - cron: '17 4 * * 1' # Mondays 04:17 UTC
  workflow_dispatch:

jobs:
  scan:
    name: Scan laws and standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Scan laws
        run: pnpm scan:laws

      - name: Scan standards
        run: pnpm scan:standards

      - name: Open pull request with updates
        uses: peter-evans/create-pull-request@v7
        with:
          branch: content/rescan
          delete-branch: true
          title: 'chore: rescan laws and standards'
          body: Automatic rescan of law and standards sources (EUR-Lex, riksdagen.se, agency föreskrifter, open standards catalogues).
          commit-message: 'chore: rescan laws and standards'
          labels: content
